[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellpainting-scverse"
version = "0.1.0"
description = "Helpers and tutorials for analysing Cell Painting profiles with scverse tools"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sara Jiménez" }]
keywords = ["cell-painting", "morphological-profiling", "scverse", "anndata", "scanpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scanpy>=1.10",
]

[project.optional-dependencies]
# GPU acceleration; pick the wheel matching your CUDA major version.
gpu = ["rapids-singlecell"]
# Everything the tutorials import.
tutorials = [
  "pycytominer>=1.5",
  "decoupler>=2.0",
  "pertpy>=1.0",
  "squidpy>=1.6",
  "pyarrow",
  "s3fs",
  "jupyterlab",
]
dev = ["pytest>=7", "ruff>=0.6", "pre-commit"]

[project.urls]
Repository = "https://github.com/sarajimenez/scverse-cellpainting-tutorials"
Issues = "https://github.com/sarajimenez/scverse-cellpainting-tutorials/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cellpainting_scverse"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# The notebooks under notebooks/ are derived from timtreis/2024_broad_hackathon;
# keep them byte-faithful to upstream rather than reformatting them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "NPY", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "RUF001", # ambiguous unicode (accented author names, µm units)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
